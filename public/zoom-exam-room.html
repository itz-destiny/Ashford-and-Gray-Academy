<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Exam Room</title>
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.0.2/css/bootstrap.css" />
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.0.2/css/react-select.css" />
  <style>html, body { margin: 0; padding: 0; height: 100%; background: #0B1F3A; }</style>
</head>
<body>
  <!--
    The live exam room shown inside a proctored exam page. Same isolation as
    zoom-classic-room.html (the Zoom SDK can't share a page with React 19),
    but set up for proctoring: no pre-join screen, video on, joined muted,
    no invite/recording/screen-share controls for the student.
  -->
  <script src="https://source.zoom.us/6.0.2/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/6.0.2/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/6.0.2/lib/vendor/react-redux.min.js"></script>
  <script src="https://source.zoom.us/6.0.2/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/6.0.2/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/6.0.2/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/6.0.2/zoom-meeting-6.0.2.min.js"></script>
  <script>
    (function () {
      function postToParent(msg) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(msg, window.location.origin);
        }
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'ZOOM_JOIN') return;

        var info = event.data.payload;

        try {
          ZoomMtg.setZoomJSLib('https://source.zoom.us/6.0.2/lib', '/av');
          ZoomMtg.preLoadWasm();
          ZoomMtg.prepareWebSDK();

          ZoomMtg.init({
            leaveUrl: window.location.origin + '/zoom-classic-left.html',
            patchJsMedia: true,
            disablePreview: true,
            isSupportAV: true,
            isSupportChat: true,
            screenShare: false,
            disableInvite: true,
            disableRecord: true,
            disableCallOut: true,
            meetingInfo: [],
            success: function () {
              ZoomMtg.join({
                signature: info.signature,
                sdkKey: info.sdkKey,
                meetingNumber: info.meetingNumber,
                passWord: info.passcode,
                userName: info.userName,
                success: function () {
                  postToParent({ type: 'ZOOM_JOINED' });
                },
                error: function (err) {
                  postToParent({ type: 'ZOOM_ERROR', message: (err && (err.reason || err.errorMessage)) || 'Could not join the exam room.' });
                },
              });
            },
            error: function (err) {
              postToParent({ type: 'ZOOM_ERROR', message: (err && (err.reason || err.errorMessage)) || 'Could not start the exam room.' });
            },
          });
        } catch (err) {
          postToParent({ type: 'ZOOM_ERROR', message: (err && err.message) || 'Could not start the exam room.' });
        }
      });

      postToParent({ type: 'ZOOM_FRAME_READY' });
    })();
  </script>
</body>
</html>
